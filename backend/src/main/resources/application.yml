spring:
    application:
        name: itms-backend

    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:itms}
        username: ${DB_USERNAME:itms}
        password: ${DB_PASSWORD:itms}
        driver-class-name: org.postgresql.Driver

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            connect-timeout: 500ms
            timeout: 500ms
            repositories:
                enabled: false

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                timezone:
                    default_storage: NORMALIZE_UTC

    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: false

    jackson:
        deserialization:
            accept-float-as-int: false
            fail-on-unknown-properties: true
        time-zone: Asia/Bangkok

server:
    port: ${SERVER_PORT:8080}

management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            show-details: never
            group:
                readiness:
                    include: readinessState,db
